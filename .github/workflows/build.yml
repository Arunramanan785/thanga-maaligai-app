name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the app files
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d unzipped; done
          true

      - name: Find the app files
        run: |
          APPJS=$(find . -name App.js -not -path '*/node_modules/*' | head -1)
          if [ -z "$APPJS" ]; then echo "App.js not found - upload the app zip or files first"; exit 1; fi
          DIR=$(dirname "$APPJS")
          echo "APPDIR=$GITHUB_WORKSPACE/$DIR" >> $GITHUB_ENV
          echo "App files are in: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: cd "$APPDIR" && npm install --no-audit --no-fund

      - name: Put your settings into the app
        run: cd "$APPDIR" && node scripts/build-html.js

      - name: Create the Android project
        run: cd "$APPDIR" && npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the APK
        run: |
          cd "$APPDIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ThangaMaaligai.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ThangaMaaligai-app
          path: ThangaMaaligai.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Thanga Maaligai app (build ${{ github.run_number }})
          files: ThangaMaaligai.apk
          make_latest: true
